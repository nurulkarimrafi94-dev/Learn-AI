[project]
name = "learn-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nurulrafi", email = "nurul.rafi@icpc.global" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.123",
    "fastapi>=0.162.0",
    "glassflow-rius>=1.5.5",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langgraph>=1.2.19",
    "pinecone>=10.3.0",
    "psycopg[binary]>=3.3.7",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
learn-ai = "learn_ai:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
